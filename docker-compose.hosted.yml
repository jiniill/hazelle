# The hosted machine (infra/): docker-compose.yml plus Caddy in front, /data on the instance disk, no local models.
#   hazelle-compose up -d   (installed by infra/cloud-init.yaml.tftpl)
# /etc/hazelle/env holds HAZELLE_IMAGE (written by scripts/deploy.sh), HAZELLE_BACKUP_REMOTE, HAZELLE_ALERT_WEBHOOK and,
# for pictures in R2 (infra/README.md "Pictures in R2"), HAZELLE_FILES_BUCKET=r2 with the HAZELLE_FILES_R2_* values and
# optionally HAZELLE_FILES_CACHE_BYTES, which docker-compose.yml passes through; left out, pictures stay on /data.
# Copy this file and docker-compose.yml to /etc/hazelle together: the R2 keys reach the app only through the base file.
services:
  app:
    ports: !reset []
    volumes:
      - /data:/data
    environment:
      # No local model servers here: every plain-http or private destination is refused.
      HAZELLE_LOCAL_PROVIDERS: !reset null
      # Hosted community and pulse service; only its own accounts contribute labels.
      HAZELLE_SELF_HOST: !reset null
      # The edge network's subnet: Caddy is the only other container on it and no port of the app is published, so a
      # peer from it is Caddy, and its X-Forwarded-For names the visitor. Change both together.
      HAZELLE_TRUSTED_PROXIES: 172.30.0.0/24
    extra_hosts: !reset []
    networks: [edge]

  backup:
    volumes:
      - /data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - 80:80
      - 443:443
      # HTTP/3, which Caddy announces in alt-svc.
      - 443:443/udp
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    networks: [edge]
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy:
